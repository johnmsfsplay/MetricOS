      - name: Validate MetricOS source files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            "build-iso.sh"
            "verify-iso.sh"
            "metricos-spec.json"
            "config/package-lists/metricos.list.chroot"
            "config/hooks/normal/0100-metricos-permissions.hook.chroot"
            "config/hooks/normal/0900-google-chrome.hook.chroot"
            "config/includes.chroot/usr/share/metricos/settings-catalog.json"
            "config/includes.chroot/usr/share/metricos/metricos-control-center.py"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required MetricOS file is missing or empty: $file"
              exit 1
            fi
          done

          # GitHub's web uploader may not preserve Unix executable bits.
          chmod +x build-iso.sh verify-iso.sh
          find config/hooks/normal -type f -name '*.hook.chroot' -exec chmod +x {} +
          find config/includes.chroot/usr/local/bin config/includes.chroot/usr/local/libexec -type f -exec chmod +x {} +

          python3 -m json.tool metricos-spec.json >/dev/null
          python3 -m json.tool config/includes.chroot/usr/share/metricos/settings-catalog.json >/dev/null
          python3 -m py_compile config/includes.chroot/usr/share/metricos/metricos-control-center.py
          bash -n build-iso.sh verify-iso.sh

          while IFS= read -r -d '' script; do
            sh -n "$script"
          done < <(find config/hooks config/includes.chroot/usr/local/bin config/includes.chroot/usr/local/libexec -type f -print0)

          if [[ -d tests ]]; then
            echo "A tests/ directory was found; running its unit tests."
            python3 -m unittest discover -s tests -v
          else
            echo "::notice::No tests/ directory is present in this repository upload. Skipping optional unit tests; required source and syntax checks are still running."
          fi

          echo "MetricOS source validation passed."

      - name: Build ISO in a Debian 13 Trixie container
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output
          docker info >/dev/null
          set +e
          docker run --pull=always --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env WITH_CHROME="$WITH_CHROME" \
            --env WITH_INSTALLER="$WITH_INSTALLER" \
            debian:trixie \
            bash -lc 'set -Eeuo pipefail; echo "Build host:"; cat /etc/os-release; ./build-iso.sh' \
            2>&1 | tee output/workflow-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            echo "::error::MetricOS ISO build failed inside the Debian Trixie container with exit code ${build_status}. See the uploaded diagnostic artifact for the build logs."
            exit "$build_status"
          fi

      - name: Verify ISO structure and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s output/metricos-1.0-amd64.iso
          test -s output/metricos-1.0-amd64.iso.sha256
          ./verify-iso.sh output/metricos-1.0-amd64.iso
          sha256sum -c output/metricos-1.0-amd64.iso.sha256
          test -s output/BUILD-INFO.txt
          echo "MetricOS ISO passed structural and SHA-256 checks."

      - name: Upload ISO and diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MetricOS-1.0-amd64-ISO
          path: |
            output/metricos-1.0-amd64.iso
            output/metricos-1.0-amd64.iso.sha256
            output/BUILD-INFO.txt
            output/metricos-build.log
            output/workflow-build.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
