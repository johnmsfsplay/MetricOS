name: Build MetricOS ISO

"on":
  workflow_dispatch:
    inputs:
      with_chrome:
        description: Include Google Chrome Stable (Firefox ESR is always included)
        required: true
        type: boolean
        default: true
      with_installer:
        description: Include the Debian live installer
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: metricos-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian 13 MetricOS ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WITH_CHROME: ${{ inputs.with_chrome && '1' || '0' }}
      WITH_INSTALLER: ${{ inputs.with_installer && '1' || '0' }}

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift
          sudo apt-get clean
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force || true
          fi
          echo "Available disk space after cleanup:"
          df -h /
          AVAILABLE_GB="$(df -Pk / | awk 'END {print int($4 / 1024 / 1024)}')"
          if [[ "$AVAILABLE_GB" -lt 27 ]]; then
            echo "::error::Only ${AVAILABLE_GB} GiB is free. MetricOS requires at least 27 GiB for the live-build workspace and ISO."
            exit 1
          fi

      - name: Check out MetricOS source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # GitHub's browser uploader can omit nested folders. If the full custom
      # config tree is absent, restore the exact config bundled with MetricOS 1.0.
      - name: Restore MetricOS desktop configuration when missing
        shell: bash
        run: |
          set -Eeuo pipefail
          required_files=(
            "config/package-lists/metricos.list.chroot"
            "config/hooks/normal/0100-metricos-permissions.hook.chroot"
            "config/hooks/normal/0900-google-chrome.hook.chroot"
            "config/includes.chroot/usr/share/metricos/settings-catalog.json"
            "config/includes.chroot/usr/share/metricos/metricos-control-center.py"
            "config/includes.chroot/usr/share/wallpapers/MetricOS-OLED/contents/images/3840x2160.svg"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing: $file"
              missing=1
            fi
          done

          if [[ "$missing" -eq 1 ]]; then
            echo "::warning::Some nested config files were not uploaded. Restoring the packaged MetricOS configuration."
            cat > "$RUNNER_TEMP/metricos-config.tar.gz.b64" <<'METRICOS_CONFIG_B64'
